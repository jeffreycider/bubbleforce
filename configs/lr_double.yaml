world_size: 8
training:
  optimizer_groups:
    - block_type: embed
      optimizer: adamw
      hyperparams:
        lr: 0.7
        weight_decay: 0.001
      lr_schedule:
        kind: piecewise_constant
        boundaries:
          - 2010
        factors:
          - 1.0
          - 2.0
    - block_type: head
      optimizer: adamw
      hyperparams:
        lr: 0.004
        weight_decay: 0.001
      lr_schedule:
        kind: piecewise_constant
        boundaries:
          - 2010
        factors:
          - 1.0
          - 2.0
    - block_type: block_matrices
      optimizer: muon
      hyperparams:
        lr: 0.025
        weight_decay: 0.05
        momentum:
          kind: ema
          decay: 0.95
          nesterov_mix: 0.95
      lr_schedule:
        kind: piecewise_constant
        boundaries:
          - 2010
        factors:
          - 1.0
          - 2.0
    - block_type: biases_and_norms
      optimizer: adamw
      hyperparams:
        lr: 0.015
        weight_decay: 0.001
      lr_schedule:
        kind: piecewise_constant
        boundaries:
          - 2010
        factors:
          - 1.0
          - 2.0
  loop: gpt_record
  seed: 0
  minibatch_seed: 0
  batch_tokens: 524288
  microbatch_sequences: 64
  train_data: data/fineweb10B/fineweb_train_*.bin
  val_data: data/fineweb10B/fineweb_val_*.bin
  val_tokens: 10485760
  run_id: lr_double
  output_dir: ${measurement.output_dir}/training
  resume_checkpoint: null
  model:
    vocab_size: 50304
    num_layers: 12
    model_dim: 768
  train_steps: 3250
  stop_step: null
  wandb_offline: true
  initialization:
    zero_projection: true
    weight_scales: {}
  seed_offset: 1337
  reseed_before_initialization: true
  checkpoint: {}
  metrics_snapshot:
    quantities:
      - weights
      - momentum
measurement:
  output_dir: runs/spectrum/lr_double
  capture_dir: ${measurement.output_dir}/captures
  validation: data/fineweb10B/fineweb_val_000000.bin
  measured_updates: null
  token_counts:
    - 16777216
  microbatch_sequences: 16
  sequence_length: 1024
  hvp_mode: compile
  gemm_precision: bf16_fp32
  matmul_precision: high
  cpu_threads: 8
  warm_start: null
  reuse_previous_vector: false
  eigensolver:
    num_requested_eigenpairs: 1
    krylov_basis_vector_counts:
      - 8
      - 16
      - 24
      - 32
      - 48
      - 64
      - 96
      - 128
    comparison_window: 2
    eigenvalue_rtol: 0.001
    subspace_tol: 0.01
    span_exhaustion_tol: 1.0e-12
    symmetric: false
    start_seed: 921
  measure_every: 50
